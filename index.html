<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CHAT STATUS</title>

<style>
* {
  box-sizing: border-box;
}

:root {
  --green: #00ff62;
  --green2: #00c94d;
  --red: #ff252c;
  --black: #020403;
}

html, body {
  margin: 0;
  width: 100%;
  min-height: 100%;
  background: #000;
  font-family: Arial, Helvetica, sans-serif;
  color: white;
}

body {
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 12px 7px;
  overflow-x: hidden;
}

/* ===== PHONE FRAME ===== */

.phone {
  width: min(100%, 410px);
  min-height: 880px;
  position: relative;
  isolation: isolate;
  overflow: hidden;
  padding: 15px 15px 17px;
  background:
    radial-gradient(ellipse at 50% 8%, rgba(0,255,70,.13), transparent 38%),
    radial-gradient(ellipse at 50% 80%, rgba(0,255,50,.07), transparent 45%),
    #010302;
  clip-path: polygon(
    22px 0, calc(100% - 22px) 0,
    100% 22px, 100% calc(100% - 22px),
    calc(100% - 22px) 100%, 22px 100%,
    0 calc(100% - 22px), 0 22px
  );
}

/* Green neon frame */
.phone::before {
  content: "";
  position: absolute;
  inset: 7px;
  z-index: 5;
  pointer-events: none;
  border: 2px solid #00ff58;
  clip-path: polygon(
    22px 0, calc(100% - 22px) 0,
    100% 22px, 100% calc(100% - 22px),
    calc(100% - 22px) 100%, 22px 100%,
    0 calc(100% - 22px), 0 22px
  );
  box-shadow:
    0 0 8px #00ff58,
    0 0 20px rgba(0,255,80,.75),
    inset 0 0 15px rgba(0,255,80,.15);
}

/* ===== DIGITAL BACKGROUND ===== */

.noise {
  position: absolute;
  inset: 0;
  z-index: -1;
  pointer-events: none;
  opacity: .55;
  background:
    repeating-linear-gradient(
      0deg,
      transparent 0px,
      transparent 5px,
      rgba(0,255,65,.055) 6px,
      transparent 7px
    ),
    repeating-linear-gradient(
      90deg,
      transparent 0px,
      transparent 25px,
      rgba(0,255,50,.025) 26px,
      transparent 27px
    );
}

.glitch-field {
  position: absolute;
  inset: 0;
  z-index: -1;
  pointer-events: none;
  background:
    linear-gradient(90deg, transparent 3%, #00ff45 3.5%, transparent 14%) 0 16% / 100% 3px no-repeat,
    linear-gradient(90deg, transparent 70%, #ff1717 70.5%, transparent 96%) 0 19% / 100% 4px no-repeat,
    linear-gradient(90deg, #00ff45, transparent 23%) 0 27% / 100% 5px no-repeat,
    linear-gradient(90deg, transparent 4%, #ff2020 4.5%, transparent 30%) 0 46% / 100% 4px no-repeat,
    linear-gradient(90deg, transparent 65%, #00ff4c 65.5%, transparent 94%) 0 52% / 100% 5px no-repeat,
    linear-gradient(90deg, #ff1616, transparent 28%) 0 70% / 100% 4px no-repeat,
    linear-gradient(90deg, transparent 60%, #00ff42 60.5%, transparent 95%) 0 88% / 100% 4px no-repeat;
  filter: drop-shadow(0 0 5px #00ff45);
}

.glitch-field::before,
.glitch-field::after {
  content: "";
  position: absolute;
  inset: 0;
  background:
    repeating-linear-gradient(
      90deg,
      transparent 0 38px,
      rgba(0,255,60,.2) 39px 41px,
      transparent 42px 65px
    );
  mask-image: repeating-linear-gradient(
    0deg,
    black 0 2px,
    transparent 3px 12px
  );
}

.glitch-field::after {
  transform: translateX(8px);
  opacity: .4;
  background:
    repeating-linear-gradient(
      90deg,
      transparent 0 60px,
      rgba(255,0,0,.35) 61px 64px,
      transparent 65px 90px
    );
}

.scanlines {
  position: absolute;
  inset: 0;
  z-index: 8;
  pointer-events: none;
  opacity: .17;
  background: repeating-linear-gradient(
    to bottom,
    transparent 0 3px,
    rgba(0,255,80,.18) 4px,
    transparent 5px
  );
}

/* ===== TOP AND BOTTOM WARNING STRIPES ===== */

.stripes {
  position: absolute;
  height: 16px;
  width: 100%;
  left: 0;
  z-index: 2;
  background: repeating-linear-gradient(
    125deg,
    transparent 0 12px,
    #00ff52 13px 25px,
    transparent 26px 36px,
    #ff2020 37px 49px,
    transparent 50px 62px
  );
  opacity: .8;
  filter: drop-shadow(0 0 6px #00ff48);
}

.stripes.top {
  top: 0;
}

.stripes.bottom {
  bottom: 0;
}

/* ===== MAIN CONTENT ===== */

.content {
  position: relative;
  z-index: 3;
  min-height: 850px;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  padding: 10px 8px 16px;
}

/* WhatsApp logo */
.brand {
  margin-top: 5px;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.brand img {
  width: 82px;
  height: 82px;
  object-fit: contain;
  filter:
    drop-shadow(0 0 5px #00ff63)
    drop-shadow(0 0 14px #00ff63);
}

.brand-name {
  font-size: 27px;
  font-weight: 800;
  color: #00ed63;
  margin-top: 2px;
  text-shadow:
    0 0 7px #00ff55,
    0 0 18px #00ff55;
}

.unofficial {
  margin-top: 5px;
  font-size: 8px;
  letter-spacing: 2px;
  color: #69ff9a;
  opacity: .85;
}

/* Main title */
.title {
  margin: 12px 0 0;
  font-size: clamp(35px, 10vw, 47px);
  font-weight: 900;
  letter-spacing: 4px;
  line-height: 1.05;
  color: #00ff60;
  text-shadow:
    0 0 5px #00ff60,
    0 0 14px #00ff60,
    0 0 30px rgba(0,255,70,.8);
}

.required {
  color: #ff3038;
  font-size: 22px;
  font-weight: 900;
  letter-spacing: 6px;
  margin-top: 13px;
  text-shadow:
    0 0 7px red,
    0 0 17px red;
}

.description {
  color: #00f46a;
  font-size: 14px;
  line-height: 1.4;
  margin: 10px 0 0;
  text-shadow: 0 0 8px #00ff58;
}

/* ===== COUNTDOWN ===== */

.timer {
  margin-top: 8px;
  color: #ff292f;
  font-size: 65px;
  font-weight: 900;
  line-height: 1.1;
  text-shadow:
    0 0 7px red,
    0 0 18px red,
    0 0 35px rgba(255,0,0,.8);
}

/* ===== PROGRESS ===== */

.progress-wrap {
  width: 100%;
  height: 25px;
  border: 2px solid #00ff60;
  border-radius: 7px;
  padding: 3px;
  margin-top: 8px;
  box-shadow:
    0 0 7px rgba(0,255,80,.8),
    inset 0 0 8px rgba(0,255,80,.3);
}

.progress-fill {
  width: 0%;
  height: 100%;
  border-radius: 2px;
  background: linear-gradient(
    90deg,
    #ff1717 0%,
    #ff4b16 22%,
    #dfff00 55%,
    #00ff54 100%
  );
  box-shadow: 0 0 10px #00ff55;
  transition: width .4s linear;
}

.percent {
  font-size: 20px;
  color: white;
  margin-top: 7px;
}

/* ===== INPUT ===== */

.input-title {
  margin-top: 15px;
  color: #ff3037;
  font-size: 22px;
  font-weight: 900;
  text-shadow:
    0 0 7px red,
    0 0 16px red;
}

.phone-input {
  width: 100%;
  height: 55px;
  margin-top: 13px;
  border: 2px solid #00ff62;
  border-radius: 10px;
  outline: none;
  background: rgba(0,20,8,.8);
  color: #fff;
  text-align: center;
  font-size: 21px;
  box-shadow:
    0 0 8px rgba(0,255,80,.6),
    inset 0 0 12px rgba(0,255,80,.08);
}

.phone-input::placeholder {
  color: #858585;
}

.phone-input:focus {
  box-shadow:
    0 0 10px #00ff60,
    0 0 22px rgba(0,255,80,.5);
}

.continue {
  width: 58%;
  height: 51px;
  margin-top: 16px;
  border: 2px solid #00ff62;
  border-radius: 10px;
  background: rgba(0,20,8,.8);
  color: #00ff62;
  font-size: 21px;
  font-weight: 900;
  letter-spacing: 3px;
  cursor: pointer;
  text-shadow: 0 0 8px #00ff62;
  box-shadow:
    0 0 9px rgba(0,255,80,.65),
    inset 0 0 10px rgba(0,255,80,.1);
}

.continue:active {
  background: rgba(0,255,70,.25);
  transform: scale(.97);
}

/* ===== TERMINAL ===== */

.terminal {
  width: 100%;
  min-height: 120px;
  margin-top: 16px;
  padding: 9px 10px;
  border: 1px solid #00ff62;
  border-radius: 4px;
  background: rgba(0,10,4,.88);
  text-align: left;
  overflow: hidden;
  box-shadow: 0 0 8px rgba(0,255,70,.25);
}

.terminal-line {
  color: #00ff62;
  font-family: "Courier New", monospace;
  font-size: 12px;
  font-weight: bold;
  line-height: 1.42;
  white-space: nowrap;
  text-shadow: 0 0 5px #00ff62;
}

/* ===== ERROR EFFECTS ===== */

.error-flash {
  animation: redflash .18s steps(2) 2;
}

@keyframes redflash {
  0% { background-color: transparent; }
  50% { background-color: rgba(255,0,0,.24); }
  100% { background-color: transparent; }
}

.shake {
  animation: shake .35s linear;
}

@keyframes shake {
  0%,100% { transform: translateX(0); }
  15% { transform: translateX(-5px); }
  30% { transform: translateX(5px); }
  45% { transform: translateX(-7px); }
  60% { transform: translateX(7px); }
  75% { transform: translateX(-4px); }
}

.broken {
  animation: broken .5s steps(2) infinite;
  filter: contrast(1.5) saturate(1.5);
}

@keyframes broken {
  0% { transform: translate(0,0); }
  25% { transform: translate(2px,-1px); }
  50% { transform: translate(-2px,1px); }
  75% { transform: translate(1px,2px); }
  100% { transform: translate(0,0); }
}

.glitch-overlay {
  display: none;
  position: absolute;
  inset: 0;
  z-index: 10;
  pointer-events: none;
  background:
    repeating-linear-gradient(
      0deg,
      transparent 0 12px,
      rgba(255,0,0,.5) 13px 15px,
      transparent 16px 27px
    ),
    linear-gradient(90deg,
      transparent 0 15%,
      rgba(255,0,0,.3) 16% 20%,
      transparent 21% 65%,
      rgba(0,255,80,.25) 66% 70%,
      transparent 71%
    );
}

.phone.final-broken .glitch-overlay {
  display: block;
}

.hidden {
  display: none !important;
}

.status-message {
  min-height: 18px;
  margin-top: 8px;
  color: #ff333a;
  font-family: "Courier New", monospace;
  font-size: 11px;
  font-weight: bold;
  text-shadow: 0 0 8px red;
}

/* Small screen fit */
@media (max-width: 380px) {
  .phone {
    min-height: 850px;
  }

  .content {
    min-height: 820px;
    padding-left: 6px;
    padding-right: 6px;
  }

  .required {
    font-size: 19px;
    letter-spacing: 4px;
  }

  .description {
    font-size: 12px;
  }

  .input-title {
    font-size: 19px;
  }

  .terminal-line {
    font-size: 10px;
  }
}
</style>
</head>

<body>

<div class="phone" id="phone">

  <div class="noise"></div>
  <div class="glitch-field"></div>
  <div class="scanlines"></div>
  <div class="stripes top"></div>
  <div class="stripes bottom"></div>
  <div class="glitch-overlay"></div>

  <main class="content">

    <div class="brand">
      <img
        src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg"
        alt="WhatsApp"
      >
      <div class="brand-name">WhatsApp</div>
      <div class="unofficial">DEMO TIDAK RASMI</div>
    </div>

    <h1 class="title">CHAT STATUS</h1>

    <div class="required">• INPUT REQUIRED •</div>

    <p class="description">
      Pemeriksaan memerlukan input untuk meneruskan paparan.
    </p>

    <div class="timer" id="timer">10</div>

    <div class="progress-wrap">
      <div class="progress-fill" id="progress"></div>
    </div>

    <div class="percent" id="percent">0%</div>

    <div class="input-title">MASUKKAN NOMBOR TELEFON</div>

    <input
      class="phone-input"
      id="phoneNumber"
      type="tel"
      inputmode="numeric"
      maxlength="11"
      placeholder="NOMBOR PAPARAN"
      autocomplete="off"
    >

    <button class="continue" id="continueBtn" disabled>
      TERUSKAN
    </button>

    <div class="status-message" id="statusMessage">
      MENUNGGU INPUT
    </div>

    <div class="terminal" id="terminal">
      <div class="terminal-line">&gt; WAITING FOR START COMMAND...</div>
      <div class="terminal-line">&gt; CHECKING RESPONSE...</div>
      <div class="terminal-line">&gt; SCANNING INTERFACE...</div>
      <div class="terminal-line">&gt; WARNING: SIGNAL UNSTABLE</div>
      <div class="terminal-line">&gt; WAITING FOR PHONE FORMAT INPUT</div>
    </div>

  </main>
</div>

<script>
const phone = document.getElementById("phone");
const timer = document.getElementById("timer");
const progress = document.getElementById("progress");
const percent = document.getElementById("percent");
const input = document.getElementById("phoneNumber");
const button = document.getElementById("continueBtn");
const terminal = document.getElementById("terminal");
const statusMessage = document.getElementById("statusMessage");

let stage = "initial";
let seconds = 10;
let errorInterval = null;
let soundContext = null;

const messages = [
  "ERROR: SIGNAL UNSTABLE",
  "WARNING: RESPONSE DELAY",
  "ERROR: INTERFACE INTERRUPTED",
  "WARNING: CONNECTION LOST",
  "ERROR: DISPLAY FAILURE",
  "WARNING: SYSTEM RESPONSE FAILED",
  "ERROR: PROCESS INTERRUPTED"
];

/* Sound starts only after button interaction */
function playErrorSound() {
  try {
    if (!soundContext) {
      soundContext = new (
        window.AudioContext || window.webkitAudioContext
      )();
    }

    if (soundContext.state === "suspended") {
      soundContext.resume();
    }

    const oscillator = soundContext.createOscillator();
    const gain = soundContext.createGain();

    oscillator.type = "square";
    oscillator.frequency.setValueAtTime(
      170,
      soundContext.currentTime
    );

    oscillator.frequency.exponentialRampToValueAtTime(
      65,
      soundContext.currentTime + .16
    );

    gain.gain.setValueAtTime(.12, soundContext.currentTime);
    gain.gain.exponentialRampToValueAtTime(
      .001,
      soundContext.currentTime + .19
    );

    oscillator.connect(gain);
    gain.connect(soundContext.destination);

    oscillator.start();
    oscillator.stop(soundContext.currentTime + .2);

  } catch (e) {}
}

function vibrateDevice() {
  if ("vibrate" in navigator) {
    navigator.vibrate([180, 70, 180]);
  }
}

function addTerminalLine(message) {
  const line = document.createElement("div");
  line.className = "terminal-line";
  line.textContent = "> " + message;

  terminal.appendChild(line);

  while (terminal.children.length > 7) {
    terminal.removeChild(terminal.firstChild);
  }
}

function updateProgress(value) {
  const safeValue = Math.max(0, Math.min(100, value));
  progress.style.width = safeValue + "%";
  percent.textContent = Math.round(safeValue) + "%";
}

function initialCountdown() {
  timer.textContent = seconds;

  const countdown = setInterval(() => {
    seconds--;
    timer.textContent = seconds;

    updateProgress(((10 - seconds) / 10) * 100);

    if (seconds <= 0) {
      clearInterval(countdown);

      timer.textContent = "00";
      updateProgress(100);

      stage = "ready";
      input.disabled = false;
      button.disabled = false;
      button.style.opacity = "1";

      statusMessage.textContent = "INPUT DIPERLUKAN";
      addTerminalLine("INPUT INTERFACE READY");
      input.focus();
    }
  }, 1000);
}

/* Initial state */
input.disabled = true;
button.disabled = true;
button.style.opacity = ".4";

initialCountdown();

/* Enable button when digits are entered */
input.addEventListener("input", () => {
  input.value = input.value.replace(/\D/g, "").slice(0, 11);

  button.disabled =
    !(stage === "ready" && input.value.length >= 10);
});

/* Error animation */
function triggerError() {
  const message =
    messages[Math.floor(Math.random() * messages.length)];

  statusMessage.textContent = message;
  addTerminalLine(message);

  phone.classList.remove("shake");
  void phone.offsetWidth;
  phone.classList.add("shake");

  phone.classList.add("error-flash");
  setTimeout(() => {
    phone.classList.remove("error-flash");
  }, 400);

  playErrorSound();
  vibrateDevice();
}

/* Second 30-second sequence */
function startSecondSequence() {
  stage = "processing";
  input.disabled = true;
  button.disabled = true;

  seconds = 30;
  timer.textContent = seconds;
  updateProgress(0);

  statusMessage.textContent = "PROCESSING DISPLAY...";
  addTerminalLine("PROCESS STARTED");

  let elapsed = 0;

  errorInterval = setInterval(() => {
    triggerError();
  }, 1450);

  const countdown = setInterval(() => {
    seconds--;
    elapsed++;

    timer.textContent = seconds;
    updateProgress((elapsed / 30) * 100);

    if (seconds <= 0) {
      clearInterval(countdown);
      clearInterval(errorInterval);

      timer.textContent = "00";
      updateProgress(100);

      stage = "finished";
      phone.classList.add("final-broken");
      phone.classList.add("broken");

      statusMessage.textContent = "DISPLAY FAILURE";
      addTerminalLine("DISPLAY INTERRUPTED");
      addTerminalLine("PROCESS TERMINATED");

      triggerError();
    }
  }, 1000);
}

button.addEventListener("click", () => {
  if (stage !== "ready") return;
  if (input.value.length < 10) return;

  playErrorSound();
  vibrateDevice();

  addTerminalLine("INPUT RECEIVED LOCALLY");
  startSecondSequence();
});
</script>

</body>
</html>
