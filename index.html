<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CHAT STATUS</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;min-height:100vh;background:#030303;color:white;
 display:flex;align-items:center;justify-content:center;
 font-family:Arial,sans-serif;overflow:hidden;
}
.phone{
 width:min(92vw,390px);min-height:680px;padding:25px 20px;
 border:2px solid #16ff75;border-radius:30px;
 background:#050505;box-shadow:0 0 25px #00ff66;
 text-align:center;position:relative;
}
.logo{
 width:65px;height:65px;border:3px solid #00ff72;
 border-radius:50%;margin:5px auto 15px;
 display:grid;place-items:center;font-size:32px;
 color:#00ff72;box-shadow:0 0 18px #00ff72;
}
h1{font-size:22px;letter-spacing:3px;color:#00ff72}
#status{font-size:13px;min-height:45px;color:#ddd}
.ring{
 width:155px;height:155px;border:3px dashed #00ff72;
 border-radius:50%;margin:25px auto;
 display:grid;place-items:center;
 animation:spin 4s linear infinite;
}
#percent{font-size:32px;font-weight:bold}
.bar{height:10px;background:#222;border-radius:20px;overflow:hidden}
#fill{height:100%;width:0;background:linear-gradient(90deg,red,#00ff72)}
button{
 width:100%;padding:16px;margin-top:25px;
 background:#061b0d;color:#00ff72;
 border:2px solid #00ff72;border-radius:12px;
 font-weight:bold;letter-spacing:3px;font-size:15px;
}
.note{font-size:10px;color:#888;margin-top:25px}
.red{border-color:red!important;box-shadow:0 0 25px red!important}
.glitch{animation:shake .12s infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes shake{
 0%{transform:translate(0)}
 25%{transform:translate(3px,-2px)}
 50%{transform:translate(-3px,2px)}
 75%{transform:translate(2px,2px)}
}
#ending{display:none;font-size:27px;font-weight:900;
 color:red;text-shadow:0 0 18px red;margin-top:100px}
#ending small{display:block;color:white;font-size:13px;margin-top:20px}
</style>
</head>
<body>
<div class="phone" id="phone">
 <div id="main">
  <div class="logo">●</div>
  <h1>CHAT STATUS</h1>
  <p id="status">SISTEM SEDIA</p>
  <div class="ring"><span id="percent">READY</span></div>
  <div class="bar"><div id="fill"></div></div>
  <button id="start">MULA</button>
  <p class="note">SIMULASI VISUAL PRANK SAHAJA</p>
 </div>
 <div id="ending">
  APA KAU TUNGGU?!
  <small>KENA PRANK! 😂<br>Tiada akaun atau mesej diakses.</small>
 </div>
</div>

<script>
const phone=document.getElementById("phone");
const statusText=document.getElementById("status");
const percent=document.getElementById("percent");
const fill=document.getElementById("fill");
const start=document.getElementById("start");

let audio;
function beep(freq,duration){
 try{
  audio=audio||new AudioContext();
  let o=audio.createOscillator();
  let g=audio.createGain();
  o.type="square";
  o.frequency.value=freq;
  g.gain.value=.04;
  o.connect(g);g.connect(audio.destination);
  o.start();o.stop(audio.currentTime+duration);
 }catch(e){}
}

const messages=[
 "MEMULAKAN SIMULASI...",
 "CHECKING VISUAL SYSTEM...",
 "CONNECTION ERROR...",
 "SYSTEM WARNING...",
 "CRITICAL ERROR...",
 "FINALIZING..."
];

start.onclick=()=>{
 start.disabled=true;
 start.textContent="PLEASE WAIT...";
 let seconds=0;

 let timer=setInterval(()=>{
  seconds++;
  let p=Math.round(seconds/30*100);
  percent.textContent=p+"%";
  fill.style.width=p+"%";

  statusText.textContent=messages[
   Math.min(messages.length-1,Math.floor(seconds/5))
  ];

  if(seconds%2===0)beep(350+Math.random()*700,.08);

  if(seconds>=20){
   phone.classList.toggle("red");
   phone.classList.add("glitch");
  }

  if(seconds>=30){
   clearInterval(timer);
   document.getElementById("main").style.display="none";
   document.getElementById("ending").style.display="block";
   phone.classList.remove("glitch");
   phone.classList.add("red");
   beep(850,.3);
  }
 },1000);
};
</script>
</body>
</html>
